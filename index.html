<dialog id="guide"><h1>怎樣練習？</h1><ol><li>預設顯示八小節五線譜。</li><li>按「開始」切換至跟奏；先數四拍預備。</li><li>音符到紅線時吹奏，依長方塊長度維持長音。</li><li>點 B／A／G 可單獨看指法及聽音。</li><li>用「速度」切換慢 60／中 80／快 100 BPM。</li><li>「示範」開啟旋律；「學生吹」關閉示範旋律，預備拍仍有提示聲。</li><li>暫停可繼續，重來會返回四拍預備。</li></ol><p>第三句採 B B B 的教學改編；樂譜與跟奏保留原稿節奏。沒有收音、評分、帳戶或學生資料收集。</p><p><a href="SOURCES.md">教材及字型來源</a></p><button id="close-guide">返回練習</button></dialog>
